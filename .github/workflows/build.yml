name: build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0); empty = just build"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libudev-dev
      - name: Unit tests
        run: cargo test --workspace
      - name: Benchmark the world pipeline
        run: cargo run --release -p voxel --example bench

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            exe: araracraft.exe
          - os: ubuntu-latest
            name: linux
            exe: araracraft
          - os: macos-latest
            name: macos
            exe: araracraft
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libudev-dev
      - name: Build (release)
        run: cargo build --release -p game
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/AraraCraft
          cp target/release/${{ matrix.exe }} dist/AraraCraft/
          cp -r packs dist/AraraCraft/packs
          cp README.md README.pt-BR.md LICENSE-MIT LICENSE-APACHE ASSETS-LICENSE.md dist/AraraCraft/
          mkdir -p dist/AraraCraft/credits
          for d in assets/sounds/*/; do cp "$d/CREDITS.md" "dist/AraraCraft/credits/sounds-$(basename "$d").md"; done
          cp docs/COMO-JOGAR.txt dist/AraraCraft/
      - uses: actions/upload-artifact@v4
        with:
          name: AraraCraft-${{ matrix.name }}
          path: dist/AraraCraft
      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: bash
        run: cd dist && 7z a ../AraraCraft-${{ matrix.name }}.zip AraraCraft
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: AraraCraft-${{ matrix.name }}.zip

  rpm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libudev-dev rpm
      - name: Build (release)
        run: cargo build --release -p game
      - name: Package RPM
        run: packaging/linux/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: AraraCraft-rpm
          path: dist/*.rpm
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*.rpm
